name: w27-blob
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight | harvest'
        required: true
        default: 'preflight'
      labels_json:
        description: 'JSON array of labels'
        required: false
        default: '["A","B","C","D","E"]'

permissions:
  contents: read

jobs:
  blob:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label: ${{ fromJSON(github.event.inputs.labels_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: egress identity
        run: |
          echo "RUNNER_IP=$(curl -s --max-time 15 https://api.ipify.org || true)"
          curl -s --max-time 15 https://ipinfo.io/json | head -c 400 || true
          echo

      - name: sdk
        run: python3 -m pip install --quiet --disable-pip-version-check "azure-storage-blob>=12.19" azure-core cryptography

      - name: run
        env:
          W27_ACCOUNTS: ${{ secrets.W27_ACCOUNTS }}
          W27_LABEL: ${{ matrix.label }}
          W27_MODE: ${{ github.event.inputs.mode }}
          W27_DEADLINE_S: '2100'
          W27_MAX_BYTES: '209715200'
          W27_KEEP_MAX: '188743680'
          ENUM_KEY: ${{ secrets.ENUM_KEY }}
        run: |
          set +e
          python3 w27_blob_runner.py
          echo "EXIT=$?"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w27-${{ github.event.inputs.mode }}-${{ matrix.label }}-${{ github.run_id }}
          path: /tmp/out.enc
          retention-days: 2
          if-no-files-found: warn
