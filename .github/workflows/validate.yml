name: azure-sql-validate

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'base64 of the JSON credential payload'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: egress
        run: echo "EGRESS_IP=$(curl -s https://api.ipify.org)"

      - name: install mssql odbc
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -qq
          sudo ACCEPT_EAGERLY=Y apt-get install -y -qq msodbcsql18 unixodbc-dev >/dev/null
          python3 -m pip install --quiet --break-system-packages pyodbc 2>&1 | tail -2 || true
          odbcinst -q -d 2>&1 | head -5

      - name: validate
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: |
          echo "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          python3 -c "import json;p=json.load(open('/tmp/payload.json'));print('entries',len(p))"
          cat > /tmp/val.py <<'PYEOF'
          import os, json, time
          import pyodbc
          payload = json.load(open("/tmp/payload.json"))
          out = []
          for item in payload:
              srv = item["server"]
              if srv.startswith("tcp:"):
                  srv = srv[4:]
              if srv.endswith(".database.secure.windows.net"):
                  srv = srv.replace(".database.secure.windows.net", ".database.windows.net")
              rec = {"server": srv, "database": item["database"], "user": item["user"],
                     "tag": item.get("tag", "")}
              t0 = time.time()
              try:
                  cs = ("DRIVER={ODBC Driver 18 for SQL Server};"
                        "SERVER=tcp:%s,1433;DATABASE=%s;UID=%s;PWD=%s;"
                        "Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=20;"
                        "Login Timeout=20;Pooling=no" % (srv, item["database"], item["user"], item["password"]))
                  cn = pyodbc.connect(cs, timeout=20, autocommit=True)
                  cur = cn.cursor()
                  cur.execute("SELECT DB_NAME(), SUSER_SNAME(), @@VERSION")
                  r = cur.fetchone()
                  rec["status"] = "SUCCESS"
                  rec["db"] = r[0]; rec["login"] = r[1]; rec["version"] = r[2][:170]
                  try:
                      cur.execute("SELECT COUNT(*) FROM sys.databases")
                      rec["db_count"] = cur.fetchone()[0]
                      cur.execute("SELECT TOP 12 name FROM sys.tables ORDER BY name")
                      rec["tables"] = [x[0] for x in cur.fetchall()]
                  except Exception as e:
                      rec["tbl_err"] = repr(e)[:220]
                  cn.close()
              except Exception as e:
                  m = str(e)
                  if "40615" in m:
                      rec["status"] = "40615_FIREWALL_BLOCKED"
                  elif "18456" in m:
                      rec["status"] = "18456_LOGIN_FAILED"
                  elif "18452" in m:
                      rec["status"] = "18452_UNSUPPORTED_ENC"
                  elif "4060" in m:
                      rec["status"] = "4060_DB_UNAVAILABLE"
                  elif "Cannot open server" in m:
                      rec["status"] = "SERVER_OPEN_FAILED"
                  elif "Login timeout" in m or "HY008" in m:
                      rec["status"] = "TIMEOUT"
                  elif "28000" in m:
                      rec["status"] = "28000_AUTH_ERROR"
                  else:
                      rec["status"] = "OTHER"
                  rec["error"] = m[:600]
              rec["ms"] = int((time.time()-t0)*1000)
              print("RESULT " + json.dumps(rec), flush=True)
              out.append(rec)
          json.dump(out, open("/tmp/results.json", "w"), indent=1)
          print("TALLY " + json.dumps({s: sum(1 for x in out if x["status"] == s) for s in set(x["status"] for x in out)}))
          PYEOF
          python3 /tmp/val.py
