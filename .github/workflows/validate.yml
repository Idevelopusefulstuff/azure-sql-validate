name: azure-sql-validate

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: 'base64 of the JSON credential payload'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: egress
        run: |
          echo "EGRESS_IP=$(curl -s https://api.ipify.org)"

      - name: install drivers
        run: |
          python3 -m pip install --quiet --break-system-packages pymssql 2>&1 | tail -2 || true
          python3 -c "import pymssql; print('pymssql', pymssql.__version__)"

      - name: validate
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: |
          echo "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          head -c 120 /tmp/payload.json; echo
          cat > /tmp/val.py <<'PYEOF'
          import os, json, base64
          import pymssql
          payload = json.load(open("/tmp/payload.json"))
          out = []
          for item in payload:
              srv = item["server"]
              if srv.startswith("tcp:"):
                  srv = srv[4:]
              if srv.endswith(".database.secure.windows.net"):
                  srv = srv.replace(".database.secure.windows.net", ".database.windows.net")
              rec = {"server": srv, "database": item["database"], "user": item["user"]}
              try:
                  cn = pymssql.connect(server=srv, port=1433, user=item["user"],
                                       password=item["password"], database=item["database"],
                                       login_timeout=20, timeout=25, tds_version="7.4")
                  cur = cn.cursor()
                  cur.execute("SELECT DB_NAME(), SUSER_SNAME(), @@VERSION")
                  r = cur.fetchone()
                  rec["status"] = "SUCCESS"
                  rec["db"] = r[0]
                  rec["login"] = r[1]
                  rec["version"] = r[2][:170]
                  try:
                      cur.execute("SELECT COUNT(*) FROM sys.databases")
                      rec["db_count"] = cur.fetchone()[0]
                      cur.execute("SELECT TOP 10 name FROM sys.tables ORDER BY name")
                      rec["tables"] = [x[0] for x in cur.fetchall()]
                  except Exception as e:
                      rec["tbl_err"] = repr(e)[:220]
                  cn.close()
              except Exception as e:
                  m = repr(e)
                  if "40615" in m:
                      rec["status"] = "40615_FIREWALL_BLOCKED"
                  elif "18456" in m:
                      rec["status"] = "18456_LOGIN_FAILED"
                  elif "18452" in m:
                      rec["status"] = "18452_UNSUPPORTED_ENC"
                  elif "4060" in m:
                      rec["status"] = "4060_DB_UNAVAILABLE"
                  elif "Cannot open server" in m:
                      rec["status"] = "SERVER_OPEN_FAILED"
                  elif "Login timeout" in m or "timed out" in m.lower():
                      rec["status"] = "TIMEOUT"
                  else:
                      rec["status"] = "OTHER"
                  rec["error"] = m[:600]
              print("RESULT " + json.dumps(rec), flush=True)
              out.append(rec)
          with open("/tmp/results.json", "w") as f:
              json.dump(out, f, indent=1)
          print("TALLY " + json.dumps({s: sum(1 for x in out if x["status"] == s) for s in set(x["status"] for x in out)}))
          PYEOF
          python3 /tmp/val.py
