name: w29-merge
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'schema | dump'
        required: true
        default: 'schema'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        label: ["A", "B", "C", "D", "E", "F", "G", "H"]
    steps:
      - uses: actions/checkout@v4

      - name: egress identity
        run: |
          echo "RUNNER_IP=$(curl -s --max-time 15 https://api.ipify.org || true)"

      - name: install drivers
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          python3 -m pip install --quiet --disable-pip-version-check pyodbc cryptography
          for i in 1 2 3; do
            sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
            sudo rm -f /etc/apt/sources.list.d/mssql-release.list
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod/ jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
            sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/mssql-release.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
            sudo ACCEPT_EAGERLY=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
            if odbcinst -q -d | grep -qi "Driver 18"; then break; fi
            sleep 5
          done
          sudo ldconfig
          odbcinst -q -d
          python3 -c "import pyodbc; print('PYODBC', pyodbc.version)"

      - name: run
        env:
          MERGE_PAYLOAD_B64: ${{ secrets.MERGE_PAYLOAD_B64 }}
          MERGE_KEY: ${{ secrets.MERGE_KEY }}
          MERGE_LABEL: ${{ matrix.label }}
          MERGE_MODE: ${{ github.event.inputs.mode }}
        run: |
          set +e
          python3 w29_merge_runner.py
          echo "EXIT=$?"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w29-${{ github.event.inputs.mode }}-${{ matrix.label }}-${{ github.run_id }}
          path: /tmp/out.enc
          retention-days: 2
          if-no-files-found: warn
