name: sql-run8
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: drivers
        run: |
          set +e
          sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/mssql-release.list
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          echo "deb [arch=amd64,armhf,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EAGERLY=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          sudo ldconfig
          python3 -m pip install --quiet pyodbc cryptography
          python3 -c "import pyodbc;print('PYODBC',pyodbc.version)"
      - name: run
        env:
          PAYLOAD_B64: ${{ secrets.W34R3_PAYLOAD_B64 }}
          ENUM_KEY: ${{ secrets.W34_KEY }}
        run: |
          set +e
          python3 runner_script8.py
          echo "EXIT=$?"
          python3 encrypt_out.py "/tmp/out/pull.json"
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w34-round3
          path: /tmp/out.enc
          retention-days: 2
          if-no-files-found: warn
