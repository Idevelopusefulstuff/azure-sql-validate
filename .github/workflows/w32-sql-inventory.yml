name: w32-sql-inventory
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory'
        required: true
        default: 'inventory'

permissions:
  contents: read

jobs:
  inv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: egress identity
        run: |
          echo "RUNNER_IP=$(curl -s --max-time 15 https://api.ipify.org || true)"
          curl -s --max-time 15 https://ipinfo.io/json | head -c 300 || true
          echo

      - name: odbc
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyodbc cryptography
          if [ -z "$(python3 -c "import pyodbc;print(' '.join(pyodbc.drivers()))" 2>/dev/null)" ]; then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            . /etc/os-release
            echo "ubuntu=${VERSION_ID}"
            curl -sSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
            sudo apt-get update -qq
            sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18 unixodbc-dev
          fi
          python3 -c "import pyodbc;print('DRIVERS',pyodbc.drivers())"

      - name: run
        env:
          W32_USER: ${{ secrets.W32_USER }}
          W32_PWD: ${{ secrets.W32_PWD }}
          W32_KEY: ${{ secrets.W32_KEY }}
        run: |
          set +e
          python3 w32_sql_inventory.py
          echo "EXIT=$?"

      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w32-inventory-${{ github.run_id }}
          path: /tmp/out.enc
          retention-days: 2
          if-no-files-found: warn
